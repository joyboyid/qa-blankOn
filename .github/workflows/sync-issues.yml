name: Sync BlankOn issues

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch issues from BlankOn/revival
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate 'repos/BlankOn/revival/issues?state=all&per_page=100' \
            --jq '[.[] | select(.pull_request == null) | {number, title, state, labels: [.labels[].name], created_at, updated_at, html_url}]' \
            | jq -s 'add | sort_by(.number) | reverse' > data/issues.json
      - name: Commit changed issue data
        run: |
          if git diff --quiet -- data/issues.json; then
            echo "No issue data changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/issues.json
          git commit -m 'chore: sync BlankOn issues'
          git push

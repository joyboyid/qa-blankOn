---
# Data dasar sistem: identitas, kernel, sumber paket, waktu — dipakai meta laporan.
- name: Kumpulkan fakta paket
  package_facts:
    manager: auto

- name: Identitas os-release
  command: cat /etc/os-release
  register: os_rel
  changed_when: false

- name: Kernel
  command: uname -r
  register: kernel
  changed_when: false

- name: Hostname
  command: hostname
  register: host
  changed_when: false

- name: Sumber APT aktif (sources.list + .list/.sources di *.d)
  shell: |
    cat /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null \
      | grep -vE '^\s*(#|//)?\s*$'
  register: apt_sources
  changed_when: false
  failed_when: false

- name: Susun meta laporan
  vars:
    line_id: "{{ (os_rel.stdout | split('\n') | select('search', '^ID=')       | first | default('')).strip() }}"
    line_pretty: "{{ (os_rel.stdout | split('\n') | select('search', '^PRETTY_NAME=') | first | default('')).strip() }}"
  set_fact:
    qa_meta:
      jahitan: "{{ jahitan }}"
      tanggal: "{{ ansible_date_time.date }} {{ ansible_date_time.time }}"
      iso: "{{ iso }}"
      hostname: "{{ host.stdout }}"
      kernel: "{{ kernel.stdout }}"
      os_id: "{{ line_id | regex_replace('^ID=/?[\\'\"]?', '') }}"
      os_pretty: "{{ line_pretty | regex_replace('^PRETTY_NAME=/?[\\'\"]?', '') | regex_replace('[\\'\"]$', '') }}"
      target_zone: "{{ target_zone }}"
      apt_sources: "{{ apt_sources.stdout | default('(tidak ada output)') }}"
---
# QA BlankOn — pengujian otomatis sistem (role per area).
# Hasil: JSON + laporan MD (dst dari role report).
#
# Target dipilih saat run, bukan di sini:
#   ansible-playbook -i inventory/inventory.ini -l localhost playbooks/qa.yaml
#   ansible-playbook -i inventory/inventory.ini -l vm playbooks/qa.yaml
#   ansible-playbook -i inventory/inventory.ini -l all playbooks/qa.yaml

- name: QA BlankOn — pengujian otomatis sistem
  hosts: blankon
  gather_facts: true
  roles:
    - base
    - timezone
    - praya
    - vlc
    - network
    - repo
    - report
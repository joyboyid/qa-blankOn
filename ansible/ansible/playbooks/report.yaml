---
- name: Render laporan Markdown dari JSON
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    results_file: /tmp/qa-results-localhost.json
    out_file: "/tmp/laporan-hasil-tes-{{ jahitan | default('unknown') }}.md"
  tasks:
    - name: Baca JSON
      slurp:
        src: "{{ results_file }}"
      register: raw

    - name: Parse
      set_fact:
        data: "{{ raw.content | b64decode | from_json }}"

    - name: Tulis MD
      copy:
        dest: "{{ out_file }}"
        content: |
          # Laporan tes BlankOn {{ jahitan | default('') }}

          - Host: {{ data.meta.hostname | default('?') }}
          - Kernel: {{ data.meta.kernel | default('?') }}
          - PASS: {{ data.total_pass }} / FAIL: {{ data.total_fail }} / Total: {{ data.total_case }}

          | ID | Area | Kasus | Hasil | Evidence |
          |---|---|---|---|---|
          {% for r in data.results -%}
          | {{ r.id }} | {{ r.area }} | {{ r.kasus }} | {{ 'PASS' if r.ok else 'FAIL' }} | {{ r.evidence | replace('|','/') | truncate(80) }} |
          {% endfor %}

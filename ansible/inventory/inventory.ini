# Inventory target tes BlankOn.
# Pilih target saat menjalankan playbook dengan `-l`:
#   -l localhost   → tes di mesin itu sendiri (live ISO / guest terpasang), tanpa SSH
#   -l vm          → tes lewat SSH ke VM (mis. VirtualBox host-only / NAT port-forward)
#   -l all         → kedua-duanya (laporan digabung per host)

[blankon_local]
localhost ansible_connection=local

[blankon_vm]
# Contoh VM VirtualBox via host-only adapter. Sesuaikan IP/user per setup Anda.
#vm-prayatest ansible_host=192.168.56.101 ansible_user=blankon ansible_become_password=blankon
#blankon-qa2 ansible_host=192.168.56.102 ansible_user=blankon ansible_become_password=blankon

[blankon:children]
blankon_local
blankon_vm